<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <!--
      Scripts only from this origin: markdown from strangers is sanitized, and this keeps an injected script
      from running even if sanitizing ever fails (the private key lives in this page). Relays (wss:), Blossom,
      YouTube oEmbed and the GitHub API are reached with connect-src; images may come from any https host. The
      only frame is YouTube's privacy-enhanced player, after Play on a video card.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https: wss: ws:; font-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'">
    <!-- Paths like /post/<id> are app routes: resolve the bundle and the SQLite worker from the site root. -->
    <base href="/">
    <title>Talk</title>
    <link rel="stylesheet" href="/styles/x-components.css">
    <link rel="stylesheet" href="/styles/talk.css">
    <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
    <div id="root"></div>
    <script src="/webApp.js"></script>
</body>
</html>
